{% extends "base.html" %}
{% block title %}{{ title }} - Админка{% endblock %}

{% block content %}
<div class="admin-form-container">
    <!-- КНОПКА НАЗАД -->
    <div class="back-link-wrapper">
        <a href="{{ url_for('main.admin_menu') }}" class="back-link">
            <i class="fas fa-arrow-left"></i> Назад к списку блюд
        </a>
    </div>

    <h1><i class="fas fa-utensils"></i> {{ title }}</h1>

    <form method="POST" class="admin-form">
        <div class="form-group">
            <label><i class="fas fa-pizza-slice"></i> Название блюда</label>
            <input type="text" name="name" value="{{ menu_item.name if menu_item else '' }}" required>
        </div>

        <div class="form-group">
            <label><i class="fas fa-store"></i> Ресторан</label>
            <select name="restaurant_id" required>
                {% for r in restaurants %}
                <option value="{{ r.id }}" {% if menu_item and menu_item.restaurant_id == r.id %}selected{% endif %}>
                    {{ r.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label><i class="fas fa-tag"></i> Цена (₽)</label>
            <input type="number" step="1" name="price" value="{{ menu_item.price if menu_item else '' }}" required>
        </div>

        <div class="form-group">
            <label><i class="fas fa-align-left"></i> Описание</label>
            <textarea name="description" rows="3">{{ menu_item.description if menu_item else '' }}</textarea>
        </div>

        <div class="form-group">
            <label><i class="fas fa-weight-hanging"></i> Вес</label>
            <input type="text" name="weight" value="{{ menu_item.weight if menu_item else '250 г' }}" placeholder="250 г">
        </div>

        <div class="form-group">
            <label><i class="fas fa-folder"></i> Категория</label>
            <select name="category">
                <option value="pizza" {% if menu_item and menu_item.category =='pizza' %}selected{% endif %}>Пицца</option>
                <option value="burger" {% if menu_item and menu_item.category =='burger' %}selected{% endif %}> Бургеры</option>
                <option value="sushi" {% if menu_item and menu_item.category =='sushi' %}selected{% endif %}>Суши</option>
                <option value="breakfast" {% if menu_item and menu_item.category =='breakfast' %}selected{% endif %}> Завтраки</option>
                <option value="drink" {% if menu_item and menu_item.category =='drink' %}selected{% endif %}> Напитки</option>
                <option value="drink" {% if menu_item and menu_item.category =='dessert' %}selected{% endif %}>Десерты</option>
                <option value="other" {% if menu_item and menu_item.category =='other' or not menu_item or not menu_item.category %}selected{% endif %}> Другое</option>
            </select>
        </div>

        <div class="form-group">
            <label><i class="fas fa-image"></i> Путь к изображению</label>
            <input type="text" name="image" value="{{ menu_item.image if menu_item else 'images/default.png' }}">
            <small>Пример: images/pizza.png</small>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-save"><i class="fas fa-save"></i> Сохранить</button>
            <a href="{{ url_for('main.admin_menu') }}" class="btn-cancel">Отмена</a>
        </div>
    </form>
</div>

<style>
.back-link-wrapper {
    margin-bottom: 20px;
}

.back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #6c757d;
    text-decoration: none;
    font-size: 0.9rem;
    padding: 8px 0;
    transition: color 0.2s;
}

.back-link:hover {
    color: #00b83a;
}

.admin-form-container {
    max-width: 600px;
    margin: 40px auto;
    padding: 30px;
    background: white;
    border-radius: 24px;
    border: 1px solid #eaeaea;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.admin-form-container h1 {
    text-align: center;
    margin-bottom: 30px;
    color: #1a1a1a;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #1a1a1a;
}

.form-group label i {
    color: #00b83a;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 1rem;
    box-sizing: border-box;
    background: white;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #00b83a;
    box-shadow: 0 0 0 3px rgba(0,184,58,0.1);
}

.form-group small {
    display: block;
    margin-top: 5px;
    color: #6c757d;
    font-size: 0.8rem;
}

.form-actions {
    display: flex;
    gap: 15px;
    margin-top: 30px;
}

.btn-save {
    flex: 1;
    padding: 12px;
    background: #00b83a;
    color: white;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
}

.btn-save:hover {
    background: #008f2c;
    transform: translateY(-1px);
}

.btn-cancel {
    flex: 1;
    padding: 12px;
    background: #f8f9fa;
    color: #6c757d;
    text-align: center;
    border-radius: 40px;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.2s;
}

.btn-cancel:hover {
    background: #e9ecef;
}
</style>
{% endblock %}
